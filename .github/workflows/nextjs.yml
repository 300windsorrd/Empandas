name: Build & Deploy to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.0'
  NEXT_APP_PACKAGE: 'tfe-starter'
  NEXT_APP_DIR: 'apps/starter'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        run: pnpm --filter ${{ env.NEXT_APP_PACKAGE }} run build

      - name: Export static site
        run: pnpm --filter ${{ env.NEXT_APP_PACKAGE }} exec next export
        env:
          NEXT_EXPORT: 'true'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-export
          path: ${{ env.NEXT_APP_DIR }}/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-export
          path: exported-site

      - name: Deploy to IONOS over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.IONOS_HOST }}
          port: ${{ secrets.IONOS_PORT || '22' }}
          username: ${{ secrets.IONOS_USERNAME }}
          password: ${{ secrets.IONOS_PASSWORD }}
          ssh_private_key: ${{ secrets.IONOS_SSH_KEY }}
          remote_path: ${{ secrets.IONOS_REMOTE_PATH }}
          local_path: exported-site/
          delete: true
          sftp_only: true
